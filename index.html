<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <form>
            <h1>Weather App</h1>
            <input type="text" placeholder="Enter city name" value="Kathmandu" >
            <button class="get-Weather">Get Weather</button>
            
            <div class="output">
                <p class="city-Name">Kathmandu</p>
                 
            <p class="date-Time">22:23 Wednesday, November 26, 2025</p>  


<i id="weather-Icon" class="fa-solid fa-cloud-sun-rain"></i>
<!-- <img id="weather-Icon" class="fa-solid fa-cloud-sun-rain"  alt="Weather Icon"> -->
<p class="temperature"> 101°C</p>
<p class="message"> clear message</p>
<p class="wind-Speed">Wind Speed : 101 m/s</p>
            </div>
           
        </form>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
